<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RJARVIS AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #050b18;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px;
    text-align: center;
    border-bottom: 1px solid #123b68;
}

header h1 {
    color: #25c8ff;
    letter-spacing: 3px;
}

header p {
    color: #8daecb;
    margin-top: 8px;
}

.container {
    max-width: 850px;
    margin: 35px auto;
    padding: 20px;
}

.status {
    text-align: center;
    color: #39e6b0;
    margin-bottom: 20px;
}

.card {
    background: #0c1930;
    border: 1px solid #174675;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
}

h2 {
    color: #25c8ff;
    margin-bottom: 15px;
}

#chat {
    height: 300px;
    overflow-y: auto;
    background: #071225;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    line-height: 1.5;
}

.user {
    background: #123d67;
    text-align: right;
}

.jarvis {
    background: #102c38;
}

input, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #23618e;
    border-radius: 8px;
    background: #071225;
    color: white;
    margin-bottom: 10px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    background: #087fbd;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 4px;
}

button:hover {
    background: #09a9e9;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #7894ad;
}
</style>
</head>

<body>

<header>
    <h1>RJARVIS AI</h1>
    <p>Your Personal Browser Assistant</p>
</header>

<div class="container">

    <div class="status">● SYSTEM ONLINE</div>

    <div class="card">
        <h2>AI Assistant</h2>

        <label for="aiMode" style="display:block;color:#8daecb;margin:0 0 8px;">AI Mode</label>
        <select id="aiMode" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #23618e;border-radius:8px;background:#071225;color:white;">
            <option value="auto">Auto (Local first, Cloud fallback)</option>
            <option value="local">Local AI (Ollama)</option>
            <option value="cloud">Cloud AI (Gemini)</option>
        </select>
        <p id="modeStatus" style="color:#8daecb;font-size:13px;margin-bottom:12px;">Auto mode tries Ollama on this computer, then Cloud AI.</p>
        <div id="chat">
            <div class="message jarvis">
                RJARVIS: Hello! I am RJARVIS. How can I help you today?
            </div>
        </div>

        <input type="text" id="userInput"
        placeholder="Type your message here..."
        onkeydown="if(event.key==='Enter') sendMessage()">

        <div class="actions">
            <button onclick="sendMessage()">Send</button>
            <button onclick="startVoice()">🎤 Speak</button>
            <button onclick="speakLast()">🔊 Speak Reply</button>
        </div>
    </div>

    <div class="card">
        <h2>Personal Notes</h2>
        <textarea id="note" placeholder="Write your notes here..."></textarea>
        <button onclick="saveNote()">Save Notes</button>
        <button onclick="loadNote()">Load Notes</button>
        <p id="noteStatus"></p>
    </div>

    <div class="card">
        <h2>Image Preview</h2>
        <input type="file" id="imageInput" accept="image/*"
        onchange="previewImage(event)">
        <img id="preview" style="max-width:100%; display:none; border-radius:10px;">
    </div>

</div>

<footer>
    RJARVIS AI © <span id="year"></span> | Personal Assistant
</footer>

<script>
let lastReply = "Hello! How can I help you?";

document.getElementById("year").textContent =
new Date().getFullYear();

function addMessage(text, type) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (!message) return;

    addMessage("You: " + message, "user");
    input.value = "";

    const chat = document.getElementById("chat");

    const loading = document.createElement("div");
    loading.className = "message jarvis";
    loading.textContent = "RJARVIS: Thinking...";
    chat.appendChild(loading);

    try {
        const mode = document.getElementById("aiMode").value;
        const reply = await getAIReply(message, mode);
        lastReply = reply;
        loading.textContent = "RJARVIS: " + reply;
    } catch (error) {
        loading.textContent = "RJARVIS: " + error.message;
    }

    chat.scrollTop = chat.scrollHeight;
}

async function getAIReply(message, mode) {
    const isLocalApp = ["localhost", "127.0.0.1"].includes(window.location.hostname) ||
        window.location.protocol === "file:";

    const localRequest = async () => {
        if (!isLocalApp) {
            throw new Error("Local AI runs only when RJARVIS is opened on this laptop. Use the Local Launcher from the GitHub project.");
        }
        const response = await fetch("http://localhost:11434/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama3.2:3b",
                messages: [{ role: "user", content: message }],
                stream: false
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Ollama request failed");
        const reply = data.message?.content?.trim();
        if (!reply) throw new Error("Ollama returned an empty reply.");
        return reply;
    };

    const cloudRequest = async () => {
        if (window.location.protocol === "file:") {
            throw new Error("Cloud AI is available on the deployed RJARVIS website. Open the Vercel website for Cloud mode.");
        }
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Cloud AI connection failed");
        return data.reply;
    };

    const status = document.getElementById("modeStatus");

    if (mode === "local") {
        status.textContent = "Connecting to Ollama on this computer...";
        try {
            const reply = await localRequest();
            status.textContent = "Connected: Local AI (Ollama)";
            return reply;
        } catch (error) {
            status.textContent = "Local AI unavailable. Open the app on this computer and check that Ollama is running.";
            throw new Error("Local Ollama could not be reached. Make sure Ollama is running and open RJARVIS from a local address (localhost), then try again.");
        }
    }

    if (mode === "cloud") {
        status.textContent = "Connecting to Cloud AI...";
        const reply = await cloudRequest();
        status.textContent = "Connected: Cloud AI";
        return reply;
    }

    if (!isLocalApp) {
        status.textContent = "Auto mode: using Cloud AI on the hosted website...";
        const reply = await cloudRequest();
        status.textContent = "Auto mode connected: Cloud AI";
        return reply;
    }

    status.textContent = "Auto mode: trying Local AI first...";
    try {
        const reply = await localRequest();
        status.textContent = "Auto mode connected: Local AI (Ollama)";
        return reply;
    } catch (localError) {
        status.textContent = "Local AI unavailable. Start Ollama and try again; Cloud mode is on the deployed website.";
        throw new Error("Could not connect to Ollama on this laptop. Check that Ollama is running and the llama3.2:3b model is installed.");
    }
}

function startVoice() {
    let SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser. Try Chrome.");
        return;
    }

    let recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.start();

    recognition.onresult = function(event) {
        document.getElementById("userInput").value =
        event.results[0][0].transcript;
        sendMessage();
    };
}

function speakLast() {
    let speech = new SpeechSynthesisUtterance(lastReply);
    speech.lang = "en-IN";
    speech.rate = 1;
    speech.pitch = 1.1;
    window.speechSynthesis.speak(speech);
}

function saveNote() {
    localStorage.setItem(
        "rjarvisNote",
        document.getElementById("note").value
    );

    document.getElementById("noteStatus").textContent =
    "Notes saved successfully!";
}

function loadNote() {
    document.getElementById("note").value =
    localStorage.getItem("rjarvisNote") || "";

    document.getElementById("noteStatus").textContent =
    "Notes loaded!";
}

function previewImage(event) {
    let file = event.target.files[0];

    if (!file) return;

    let preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
}
</script>

</body>
</html>
